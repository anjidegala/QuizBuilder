<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Course</title><link rel="stylesheet" href="css/style.css"></head><body><nav><b class="logo">✦ QuizMaster <i>Pro</i></b><a href="admin-dashboard.html">← Admin</a></nav><main><div class="center"><span>ADMIN · COURSE BUILDER</span><h1>Create Course</h1></div><div class="panel form"><label>Course Title<input id="title" placeholder="Python Programming"></label><label>Description<textarea id="desc"></textarea></label><div class="row"><label>Category<select id="cat"><option>Programming</option><option>Web Development</option><option>Data Science</option><option>AI & ML</option><option>Cybersecurity</option><option>Computer Science</option></select></label><label>Level<select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div><label>Course Image<input type="file" accept="image/*" onchange="readImg(event)"></label><img id="preview" class="upload"><button class="btn" onclick="saveCourse()">💾 Save Course</button></div></main><script src="js/auth.js"></script><script src="js/create.js"></script><script>guard("admin")</script></body></html>
