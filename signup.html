<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up | QuizMaster Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <b class="logo">✦ QuizMaster <i>Pro</i></b>
  <a href="index.html">← Home</a>
</nav>
<main class="login signup-layout">
  <div class="loginbox">
    <div class="big">✨</div>
    <span>CREATE YOUR ACCOUNT</span>
    <h1>Join QuizMaster</h1>
    <p>Create a student account and start learning.</p>
    <form onsubmit="signup(event)">
      <label>Full Name<input id="name" required placeholder="Enter your name"></label>
      <label>Username<input id="su" required minlength="3" placeholder="Choose a username"></label>
      <label>Email<input id="email" type="email" required placeholder="you@example.com"></label>
      <div class="row">
        <label>Password<input id="sp" type="password" required minlength="4" placeholder="Minimum 4 characters"></label>
        <label>Confirm Password<input id="cp" type="password" required minlength="4" placeholder="Repeat password"></label>
      </div>
      <button class="btn full">Create Account →</button>
      <div id="signupMsg"></div>
    </form>
    <div class="demo">Already have an account? <a href="login.html"><b>Login here</b></a></div>
  </div>
  <div class="loginart signup-art">🚀<h2>Start your learning journey</h2><p>Learn skills, practice quizzes and track your progress.</p></div>
</main>
<script src="js/auth.js"></script>
</body>
</html>
